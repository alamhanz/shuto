[project]
name = "shuto"
version = "0.1.0"
description = "Weekly photo batches -> AI metadata (Bedrock) -> Shutterstock"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
