# Model catalog for shuto. Editable; user overrides can be merged via load_catalog(extra=...).
# Sizes, tags, speeds and prices are APPROXIMATE and dated: re-verify before each release
# (ollama.com/library for tags and sizes; provider pricing pages for API prices).
# Entries with `verify: true` have a tag or numbers that were not confirmed at writing time.
# est_s = heuristic seconds/image (warm model, ~1024 px image, ~600 output tokens), replaced by a
# measured value once `shuto models bench` has run. Missing tier keys fall back (gpu_8 -> gpu_6,
# gpu_24 -> gpu_12, apple_64 -> apple_32, then cpu).
# context_tokens = the model's context window; 4096 or less gets the short prompt (see
# local_models.SMALL_CONTEXT_TOKENS).
# Sample image: src/shuto/data/sample.jpg is a CC0 street photo from Wikimedia Commons
# (credit in SAMPLE_CREDIT.md); swap in any public-domain photo with the same name.
version: 1
updated: 2026-10-12

