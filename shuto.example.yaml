# Copy to shuto.yaml (gitignored). Secrets never go here: use env vars, .env or the OS keyring.
# SHUTO_FTPS_USER, SHUTO_FTPS_PASSWORD, ANTHROPIC_API_KEY, GEMINI_API_KEY
# Bedrock uses the normal AWS profile chain.
workspace: null                    # null = per-user data dir (platformdirs)
sources:
  - {path: ~/Pictures/exports, recursive: true}
import:
  batch_by: iso_week
  near_duplicate_distance: 6
  extensions: [.jpg, .jpeg, .heic, .png]
cull:
  min_megapixels: 4.0
  min_sharpness: 80.0
  mean_luma_range: [35, 220]
  max_clipped_shadows_pct: 8.0
  max_clipped_highlights_pct: 5.0
llm:
  provider: ollama                 # ollama | anthropic | gemini | bedrock | fake
  model: auto                      # auto = the model you chose with `shuto models use` / Settings (never picked for you)
  image_max_side: null             # null = per-provider default (local 1024, API 1568)
  concurrency: null                # null = 1 for ollama, 4 for APIs
  max_tokens: 1500
  temperature: 0.2
  json_retries: 1
  timeout_s: 300
  ollama: {url: "http://127.0.0.1:11434", keep_alive: 10m}
  bedrock: {region: null, profile: null}
style:
  theme: ""                        # for example "Street food", "Mountain trails", "Everyday Japan"
  region_focus: ""                 # "" (none) or "japan": romaji place names, Japan-first rules and shuto's own Japan rules
  tone: "documentary, warm, factual; no hype words"
  language: en
  keywords:
    min: 25
    max: 50
    always_include: []             # for example [japan] for an Everyday Japan portfolio
    romaji_place_names: false      # true adds "use romaji for Japanese place names"
    seasonal_terms: true
  avoid: [beautiful, amazing, stunning]
  extra_instructions: ""
  default_place:                   # used in editorial captions when a photo has no known place
    city: ""                       # for example Tokyo
    country: ""                    # for example Japan
filters:                           # extra checks in the same AI call as the description
  theme_check: true                # with style.theme set: photos that do not fit are set aside
  theme_partly: pass               # a "partly" fit: pass (shown in Review) or flag ("Needs a look")
  rules: []                        # at most 10, each 2-80 characters on one line, for example:
  # - {kind: avoid, text: "people", mode: set_aside}      # mode: set_aside or flag
  # - {kind: include, text: "a street scene", mode: flag}
restrictions:
  builtin: true
  extra_files: []
  disabled_rules: []
review:
  auto_approve_clean: false
prepare:
  filename_pattern: "{date:%Y%m%d}-{slug}-{n:03d}"
  slug_words: 5
  jpeg_quality: 95
releases:
  dir: null
deliver:
  ftps_host: ftps.shutterstock.com
  upload_enabled: false
web:
  host: 127.0.0.1
  port: 8765
  open_browser: true
