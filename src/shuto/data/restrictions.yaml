  - Nike
  - Adidas

# Events where Shutterstock wants press credentials and a case number before editorial
# submission (Legal Documentation). The model reports an event; a match goes to review.
credential_events:
  - concert
  - sports
  - match
  - game
  - race
  - rally
  - election
  - press conference
  - panel
  - red carpet
  - runway
  - fashion show
  - theatre
  - theater
  - stage play
  - airshow
  - air show
  - reenactment

# What shuto does with the signals the model reports in "detected"
# (actions: force_editorial, review, block; same words as the Outcomes table in the doc).
detected_actions:
  artworks_or_characters: force_editorial   # no property release: editorial only
  artwork_is_main_subject: review           # isolated artwork is rejected even as editorial
  private_interior: force_editorial         # no property release: editorial only
  screen_content: force_editorial           # editorial only (not as the primary subject)
  credential_event: review                  # press credentials + case number needed
  id_or_card_number: block                  # financial/government ID numbers: not accepted
  personal_data_other: review               # names, addresses, phones: editorial, check it

