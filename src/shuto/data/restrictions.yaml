# Shutterstock restrictions for shuto's guardrails.
# Machine-readable copy of docs/shutterstock-restrictions.md - keep both in sync.
# Lists are non-exhaustive; Shutterstock reviews case by case. Re-check the sources every few months.
#
# Rule fields: id, name, aliases (default []), level, category, region (default global),
# condition (default null; a rule with a condition sends the photo to review instead of acting
# on the level, because shuto cannot verify it), note (default "").
version: 2
compiled: 2026-10-16
source_doc: docs/shutterstock-restrictions.md
source_page_date: 2026-03-25
# Version 2 adds sources, credential_events and detected_actions. A version 1 file (these keys
# missing) still loads; shuto then uses the same defaults.
sources:
  - https://submit.shutterstock.com/help/en/articles/10617417-how-do-i-submit-editorial-content
  - https://submit.shutterstock.com/help/en/articles/10617427-content-publishing-standards-contextual-metadata
  - https://submit.shutterstock.com/help/en/articles/10617411-content-publishing-standards-legal-documentation
  - https://submit.shutterstock.com/help/en/articles/10617446-content-publishing-standards-intellectual-property
  - https://submit.shutterstock.com/help/en/articles/10594677-content-publishing-standards-personally-identifiable-information-pii

# restricted: commercial rejected, editorial OK -> force editorial
# prohibited: rejected everywhere -> block
# no_upload:  Shutterstock's own editorial team covers it -> block
levels:
  restricted: force_editorial
  prohibited: block
  no_upload: block

# Brand and trademarked names. Not allowed in commercial titles or keywords: shuto strips them
# from keywords and flags them in the description. Documentary editorial may name them (IP
# article), so an editorial photo keeps them. Restricted-list items below are always rejected.
trademark_terms:
  - 7-Eleven
  - Seven Eleven
  - FamilyMart
  - Lawson
  - Kikkoman
  - Pokemon
  - Pikachu
  - Gotta Catch 'Em All
  - Tachikara
  - Space Invaders
