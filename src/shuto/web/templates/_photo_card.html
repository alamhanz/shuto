<article class="card {{ c.status }}">
  <label class="pick"><input type="checkbox" name="ids" value="{{ c.id }}" form="bulk-form" aria-label="Select {{ c.name }}"></label>
  <a href="/photo/{{ c.id }}"><img loading="lazy" src="/thumb/{{ c.id }}" alt="{{ c.name }}"></a>
  <div class="meta">
    <span class="badge s-{{ c.status }}">{{ c.status }}</span>
    {% if c.group is not none %}<span class="badge">similar group {{ c.group }}</span>{% endif %}
    {% if c.editorial %}<span class="badge">editorial</span>{% endif %}
    {% if c.gps %}<span class="badge warn" title="This photo has GPS in its EXIF">GPS</span>{% endif %}
    <div class="name">{{ c.name }}</div>
    {% if c.snippet %}<div class="snip">{{ c.snippet }}</div>{% endif %}
    {% for r in c.reasons %}<div class="reason">{{ r }}</div>{% endfor %}
  </div>
</article>
